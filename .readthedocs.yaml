# ReadTheDocs build of the Python documentation (python/docs). The package is
# built from source, so the API pages document the real installed package.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  apt_packages:
    - libnetcdf-dev

sphinx:
  configuration: python/docs/conf.py
  fail_on_warning: true

python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - plot
    - requirements: python/docs/requirements.txt
