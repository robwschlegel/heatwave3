[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.13"]
build-backend = "scikit_build_core.build"

[project]
name = "heatwave3"
version = "0.1.0a1"
description = "Detect marine heatwaves and cold-spells directly in gridded NetCDF data"
readme = "python/README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE.md"]
authors = [
  { name = "Robert W. Schlegel", email = "robwschlegel@gmail.com" },
  { name = "Albertus J. Smit", email = "albertus.smit@gmail.com" },
]
maintainers = [
  { name = "Robert W. Schlegel", email = "robwschlegel@gmail.com" },
  { name = "Albertus J. Smit", email = "albertus.smit@gmail.com" },
]
keywords = ["marine heatwave", "cold-spell", "climatology", "NetCDF", "oceanography"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: C++",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Atmospheric Science",
  "Topic :: Scientific/Engineering :: Hydrology",
]
dependencies = ["numpy>=1.23", "pandas>=1.5"]

[project.optional-dependencies]
parquet = ["pyarrow>=10"]
plot = ["matplotlib>=3.6"]
test = ["pytest>=7", "pyarrow>=10", "matplotlib>=3.6"]

[project.urls]
Homepage = "https://github.com/robwschlegel/heatwave3"
Source = "https://github.com/robwschlegel/heatwave3"
"R package" = "https://robwschlegel.github.io/heatwave3/"

[tool.scikit-build]
minimum-version = "build-system.requires"
wheel.packages = ["python/heatwave3"]
# The repo root is also the R package. Publish an explicit allowlist so R files
# and stray local files (e.g. editor or agent settings) never reach PyPI.
sdist.exclude = ["*"]
sdist.include = [
  "/pyproject.toml", "/CMakeLists.txt", "/LICENSE.md", "/python/README.md",
  "/python/heatwave3/*.py", "/python/src/*.cpp", "/python/tests/*.py",
  "/src/hw3_api.cpp", "/src/hw3_api.h", "/src/hw3_log.h", "/src/hw3_omp.h",
  "/src/heatwave3_types.h", "/src/netcdf_io.cpp", "/src/netcdf_io.h",
  "/src/climatology.cpp", "/src/climatology.h", "/src/event_detect.cpp",
  "/src/event_detect.h", "/src/blob_core.cpp", "/src/blob_core.h",
]

[tool.pytest.ini_options]
testpaths = ["python/tests"]
